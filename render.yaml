services:
  - type: web
    name: sis-cyber-fortress-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:contracts && npm --workspace=@sis/api run prisma:generate && npm --workspace=@sis/api run build
    startCommand: cd apps/api && npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/src/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BACKUP_MASTER_ENVELOPE_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sis-cyber-fortress-db
          property: connectionString

databases:
  - name: sis-cyber-fortress-db
    plan: free
    databaseName: sis_cyber_fortress
    user: sis_admin
